{% extends "base.html" %}
{% block content %}
<h1>New run</h1>
<form method="post" action="/runs/new" class="card">
  <label>Brief</label>
  <textarea name="brief" rows="5" placeholder="Build a CPF validator module with tests"></textarea>

  <div style="margin-top: 1rem;">
    <label>Or GitHub issue URL</label>
    <input type="url" name="issue_url" placeholder="https://github.com/owner/repo/issues/123" />
    <label class="row" style="margin-top: 0.5rem;">
      <input type="checkbox" name="clone_repo" value="1" />
      Clone repository into workspace/repo/
    </label>
  </div>

  <div style="margin-top: 1rem;">
    <label>Builder backend</label>
    <select name="builder">
      <option value="native" {% if default_builder == "native" %}selected{% endif %}>native</option>
      <option value="deepagents" {% if default_builder == "deepagents" %}selected{% endif %}>deepagents</option>
    </select>
  </div>
  <div class="row" style="margin-top: 1rem;">
    <button type="submit">Start company</button>
    <a class="btn" href="/">Cancel</a>
  </div>
</form>
{% endblock %}
