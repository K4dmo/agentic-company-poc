<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agentic Company</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; padding: 1.5rem; max-width: 960px; margin-inline: auto; }
    a { color: inherit; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #8884; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    button, .btn { padding: 0.45rem 0.9rem; border-radius: 6px; border: 1px solid #8886; background: #1112; cursor: pointer; text-decoration: none; }
    textarea, input, select { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #8886; background: transparent; }
    pre { white-space: pre-wrap; word-break: break-word; background: #8881; padding: 0.75rem; border-radius: 6px; }
    .muted { opacity: 0.7; }
  </style>
</head>
<body>
  <header class="row" style="justify-content: space-between; margin-bottom: 1.5rem;">
    <div>
      <strong>Agentic Company</strong>
      <div class="muted">LangGraph Planner → Builder → Critic</div>
    </div>
    <a class="btn" href="/runs/new">New run</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
